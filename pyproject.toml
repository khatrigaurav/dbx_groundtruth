[project]
name = "groundtruth"
version = "0.1.0"
description = "GroundTruth — simplified answer-key eval app (Samsara)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pg8000>=1.31.0",
    "databricks-sdk>=0.81.0",
    "mlflow>=3.10.0",
    "openai>=1.52.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
