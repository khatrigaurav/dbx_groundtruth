# NOTE: For bundle deploys (the supported path — see DEPLOY.md), the app command and
# environment are defined authoritatively in `databricks.yml` under
# resources.apps.groundtruth.config, which OVERRIDES this file. This stub only carries
# the start command so a bare `databricks apps deploy` (no bundle) still launches.
# All env vars — including the Lakebase endpoint, serving endpoint, warehouse and
# experiment bindings — are set by the bundle so nothing here is workspace-specific.
command:
  - "gunicorn"
  - "server.app:app"
  - "-c"
  - "gunicorn_conf.py"
